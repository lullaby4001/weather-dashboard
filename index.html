<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>溫濕度與天氣預報系統</title>
  <!-- Font Awesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google 字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f7f2ec;
      --card-bg: #ffffff;
      --card-border: #e8ded5;
      --text-main: #4a3324;
      --text-muted: #8c7361;
      --accent-temp: #c88a58;
      --accent-humidity: #8c6239;
      --accent-dark: #3a2618;
      --accent-light: #f1e4d8;
      --shadow-sm: 0 4px 15px rgba(74, 51, 36, 0.05);
      --shadow-md: 0 8px 25px rgba(74, 51, 36, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Serif TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* 頂部標頭區 */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand i {
      font-size: 2rem;
      color: var(--accent-temp);
    }

    .brand h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    /* 控制列 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      width: 100%;
    }

    .search-box {
      display: flex;
      flex: 1;
      min-width: 260px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--card-border);
      border-right: none;
      border-radius: 8px 0 0 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
      color: var(--text-main);
    }

    .search-box button {
      padding: 10px 18px;
      background: var(--accent-humidity);
      color: #fff;
      border: 1px solid var(--accent-humidity);
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background: var(--accent-dark);
    }

    select, .btn-geo {
      padding: 10px 16px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: #fff;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .btn-geo {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      color: var(--accent-dark);
      border-color: var(--card-border);
      font-weight: 600;
    }

    .btn-geo:hover {
      background: var(--card-border);
    }

    /* 氣候 Dashboard Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .temp-main {
      font-size: 3rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 8px;
    }

    .humidity-main {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent-humidity);
      line-height: 1;
      margin-bottom: 8px;
    }

    .meta-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    /* 生活建議專區 */
    .advice-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 5px solid var(--accent-temp);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .advice-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .advice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .advice-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--bg-color);
      padding: 12px 16px;
      border-radius: 10px;
    }

    .advice-item i {
      font-size: 1.2rem;
      color: var(--accent-temp);
      margin-top: 2px;
    }

    /* 圖表容器 */
    .chart-container {
      position: relative;
      height: 380px;
      margin-bottom: 32px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-legend-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 每日預報網格 */
    .forecast-header {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .daily-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .daily-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .daily-card.history {
      background: #faf6f0;
      border-style: dashed;
    }

    .daily-date {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .daily-icon {
      font-size: 1.8rem;
      color: var(--accent-temp);
      margin: 8px 0;
    }

    .daily-temp {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .daily-humidity {
      font-size: 0.85rem;
      color: var(--accent-humidity);
      margin-top: 4px;
    }

    .history-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.65rem;
      background: var(--card-border);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .daily-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--accent-light);
      color: var(--accent-dark);
      font-weight: 600;
    }

    /* Loading 遮罩 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(247, 242, 236, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid var(--card-border);
      border-top-color: var(--accent-temp);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .brand h1 { font-size: 1.4rem; }
      .temp-main, .humidity-main { font-size: 2.4rem; }
      .chart-container { height: 300px; }
    }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay active">
    <div class="spinner"></div>
    <p style="margin-top: 16px; color: var(--text-main); font-weight: 600;">正在讀取天氣與氣侯資訊...</p>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <i class="fa-solid fa-mug-hot"></i>
        <h1 id="locationTitle">溫濕度與天氣預報系統</h1>
      </div>
    </header>

    <!-- 控制選單與搜尋列 -->
    <div class="controls" style="margin-bottom: 24px;">
      <button class="btn-geo" onclick="useGeolocation()">
        <i class="fa-solid fa-crosshairs"></i> 自動定位
      </button>

      <select id="citySelect" onchange="onCitySelectChange(this)">
        <option value="" disabled selected>切換全台縣市...</option>
        <option value="25.1283,121.7419">基隆市</option>
        <option value="25.0330,121.5654">臺北市</option>
        <option value="25.0170,121.4628">新北市</option>
        <option value="24.9936,121.3010">桃園市</option>
        <option value="24.8138,120.9675">新竹市</option>
        <option value="24.8383,121.0177">新竹縣</option>
        <option value="24.5601,120.8214">苗栗縣</option>
        <option value="24.1477,120.6736">臺中市</option>
        <option value="24.0817,120.5385">彰化縣</option>
        <option value="23.9037,120.6859">南投縣</option>
        <option value="23.7093,120.4313">雲林縣</option>
        <option value="23.4801,120.4491">嘉義市</option>
        <option value="23.4588,120.5740">嘉義縣</option>
        <option value="22.9997,120.2270">臺南市</option>
        <option value="22.6273,120.3014">高雄市</option>
        <option value="22.6719,120.4880">屏東縣</option>
        <option value="24.7570,121.7530">宜蘭縣</option>
        <option value="23.9872,121.6015">花蓮縣</option>
        <option value="22.7583,121.1444">臺東縣</option>
        <option value="23.5711,119.5793">澎湖縣</option>
        <option value="24.4493,118.3766">金門縣</option>
        <option value="26.1505,119.9499">連江縣</option>
      </select>

      <select id="daysSelect" onchange="onDaysSelectChange(this)">
        <option value="1">1 天 (當日氣溫)</option>
        <option value="3">3 天預報</option>
        <option value="7" selected>7 天 (一週預報)</option>
        <option value="14">14 天 (兩週預報)</option>
        <option value="16">16 天 (模型極限預報)</option>
        <option value="30">1 個月 (30天 - 含歷史氣候趨勢)</option>
        <option value="60">2 個月 (60天 - 含歷史氣候趨勢)</option>
      </select>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="輸入地址或地名 (例如: 高雄市楠梓區科技路)" onkeypress="if(event.key==='Enter') searchLocation()">
        <button onclick="searchLocation()"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </div>

    <!-- 即時 Dashboards -->
    <div class="dashboard-grid">
      <div class="card">
        <div class="card-title">
          <span>目前氣溫</span>
          <i class="fa-solid fa-temperature-three-quarters" style="color: var(--accent-temp);"></i>
        </div>
        <div class="temp-main" id="currentTemp">--°C</div>
        <div class="meta-info">
          <span id="currentApparentTemp">體感 --°C</span>
          <span id="currentWeatherText">載入中...</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>目前相對濕度</span>
          <i class="fa-solid fa-droplet" style="color: var(--accent-humidity);"></i>
        </div>
        <div class="humidity-main" id="currentHumidity">--%</div>
        <div class="meta-info">
          <span id="humidityStatus">舒適度計算中</span>
        </div>
      </div>
    </div>

    <!-- 天氣與穿搭建議 -->
    <div class="advice-card">
      <div class="advice-header">
        <i class="fa-solid fa-shirt"></i> 今日生活與穿搭出門指引
      </div>
      <div class="advice-grid" id="adviceContainer">
        <div class="advice-item">載入建議中...</div>
      </div>
    </div>

    <!-- Chart.js 雙軸圖表 -->
    <div class="card" style="margin-bottom: 24px;">
      <div class="chart-header">
        <div class="forecast-header" style="margin-bottom:0;">
          <i class="fa-solid fa-chart-line"></i> 溫濕度趨勢分析
        </div>
        <div class="chart-legend-info">
          實線：數值預報 | 虛線：歷史氣候推估
        </div>
      </div>
      <div class="chart-container">
        <canvas id="weatherChart"></canvas>
      </div>
    </div>

    <!-- 每日預報網格 -->
    <div style="margin-bottom: 40px;">
      <div class="forecast-header">
        <i class="fa-solid fa-calendar-days"></i> 逐日溫濕度預報卡片
      </div>
      <div class="forecast-grid" id="forecastGrid"></div>
    </div>
  </div>

  <script>
    // 全局狀態
    let currentLat = 25.0330;
    let currentLon = 121.5654;
    let currentDays = 7;
    let currentLocationName = "臺北市";
    let chartInstance = null;

    const WMO_CODES = {
      0: { text: "晴朗", icon: "fa-sun" },
      1: { text: "晴時多雲", icon: "fa-cloud-sun" },
      2: { text: "多雲", icon: "fa-cloud-sun" },
      3: { text: "陰天", icon: "fa-cloud" },
      45: { text: "有霧", icon: "fa-smog" },
      48: { text: "濃霧", icon: "fa-smog" },
      51: { text: "輕微細雨", icon: "fa-cloud-rain" },
      53: { text: "中度細雨", icon: "fa-cloud-rain" },
      55: { text: "大細雨", icon: "fa-cloud-showers-heavy" },
      61: { text: "小雨", icon: "fa-cloud-rain" },
      63: { text: "中雨", icon: "fa-cloud-showers-heavy" },
      65: { text: "大雨", icon: "fa-cloud-showers-heavy" },
      80: { text: "陣雨", icon: "fa-cloud-sun-rain" },
      81: { text: "強陣雨", icon: "fa-cloud-showers-heavy" },
      95: { text: "雷陣雨", icon: "fa-cloud-bolt" }
    };

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      useGeolocation();
    });

    // 取得 GPS 定位
    function useGeolocation() {
      showLoading(true);
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            currentLat = pos.coords.latitude;
            currentLon = pos.coords.longitude;
            currentLocationName = "當前位置";
            document.getElementById('citySelect').value = "";
            await updateAll();
          },
          async (err) => {
            console.warn("GPS 定位失敗或拒絕，改用預設臺北市:", err.message);
            currentLocationName = "臺北市";
            document.getElementById('citySelect').value = `${currentLat},${currentLon}`;
            await updateAll();
          },
          { timeout: 7000 }
        );
      } else {
        updateAll();
      }
    }

    // 當下拉切換城市
    function onCitySelectChange(select) {
      if (!select.value) return;
      const [lat, lon] = select.value.split(',');
      currentLat = parseFloat(lat);
      currentLon = parseFloat(lon);
      currentLocationName = select.options[select.selectedIndex].text;
      updateAll();
    }

    // 當下拉切換天數
    function onDaysSelectChange(select) {
      currentDays = parseInt(select.value);
      updateAll();
    }

    // 台灣地址解構反轉演算法 (高雄市 楠梓區 科技路)
    function parseTaiwaneseDisplayName(result) {
      if (!result || !result.display_name) return "未知地點";
      const rawParts = result.display_name.split(',').map(s => s.trim());
      const cleanParts = rawParts.filter(p => p !== '臺灣' && p !== 'Taiwan' && !/^\d+$/.test(p));
      if (cleanParts.length === 0) return result.display_name.split(',')[0];
      return cleanParts.reverse().join(' ');
    }

    // 地址搜尋
    async function searchLocation() {
      const input = document.getElementById('searchInput');
      const query = input.value.trim();
      if (!query) return;

      showLoading(true);
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&accept-language=zh-TW`);
        const data = await res.json();

        if (data && data.length > 0) {
          const first = data[0];
          currentLat = parseFloat(first.lat);
          currentLon = parseFloat(first.lon);
          currentLocationName = parseTaiwaneseDisplayName(first);
          document.getElementById('citySelect').value = "";
          await updateAll();
        } else {
          alert('找不到該地點，請輸入更詳細的地址或縣市名稱！');
          showLoading(false);
        }
      } catch (err) {
        console.error(err);
        alert('搜尋地點時發生網路錯誤');
        showLoading(false);
      }
    }

    // 核心資料更新
    async function updateAll() {
      showLoading(true);
      document.getElementById('locationTitle').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${currentLocationName}`;

      try {
        // 1. 抓取即時天氣與未來最多 16 天預報
        const forecastDaysLimit = Math.min(currentDays, 16);
        const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weathercode&daily=temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,precipitation_sum,weathercode&forecast_days=${forecastDaysLimit}&timezone=Asia%2FTaipei`;
        
        const forecastRes = await fetch(forecastUrl);
        const forecastData = await forecastRes.json();

        // 渲染即時資料
        renderCurrentWeather(forecastData.current);

        let times = [...forecastData.daily.time];
        let maxTemps = [...forecastData.daily.temperature_2m_max];
        let minTemps = [...forecastData.daily.temperature_2m_min];
        let humidities = [...forecastData.daily.relative_humidity_2m_mean];
        let precipitations = [...forecastData.daily.precipitation_sum];
        let weatherCodes = [...forecastData.daily.weathercode];

        // 2. 若超過 16 天，並行抓取歷史數據 (Archive API)
        if (currentDays > 16) {
          const neededArchiveDays = currentDays - 16;
          const today = new Date();
          
          // 計算去年同期的起止日期
          const lastYearStart = new Date(today);
          lastYearStart.setFullYear(today.getFullYear() - 1);
          lastYearStart.setDate(lastYearStart.getDate() + 16);

          const lastYearEnd = new Date(lastYearStart);
          lastYearEnd.setDate(lastYearEnd.getDate() + neededArchiveDays - 1);

          const startStr = lastYearStart.toISOString().split('T')[0];
          const endStr = lastYearEnd.toISOString().split('T')[0];

          const archiveUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${currentLat}&longitude=${currentLon}&start_date=${startStr}&end_date=${endStr}&daily=temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,precipitation_sum,weathercode&timezone=Asia%2FTaipei`;

          const archiveRes = await fetch(archiveUrl);
          const archiveData = await archiveRes.json();

          if (archiveData.daily) {
            for (let i = 0; i < archiveData.daily.time.length; i++) {
              // 模擬未來的日期標籤
              const futureDate = new Date(today);
              futureDate.setDate(today.getDate() + 16 + i);
              times.push(futureDate.toISOString().split('T')[0]);

              maxTemps.push(archiveData.daily.temperature_2m_max[i]);
              minTemps.push(archiveData.daily.temperature_2m_min[i]);
              humidities.push(archiveData.daily.relative_humidity_2m_mean[i]);
              precipitations.push(archiveData.daily.precipitation_sum[i] || 0);
              weatherCodes.push(archiveData.daily.weathercode[i] || 0);
            }
          }
        }

        const combinedDaily = {
          time: times,
          temperature_2m_max: maxTemps,
          temperature_2m_min: minTemps,
          relative_humidity_2m_mean: humidities,
          precipitation_sum: precipitations,
          weathercode: weatherCodes
        };

        // 3. 渲染生活與穿搭建議
        renderAdvice(combinedDaily);

        // 4. 渲染圖表與 daily 卡片
        renderChart(combinedDaily);
        renderForecastCards(combinedDaily);

      } catch (err) {
        console.error("更新氣象資料失敗:", err);
      } finally {
        showLoading(false);
      }
    }

    // 渲染即時氣溫 Dashbaord
    function renderCurrentWeather(current) {
      if (!current) return;
      document.getElementById('currentTemp').textContent = `${Math.round(current.temperature_2m)}°C`;
      document.getElementById('currentApparentTemp').textContent = `體感 ${Math.round(current.apparent_temperature)}°C`;
      
      const rh = current.relative_humidity_2m;
      document.getElementById('currentHumidity').textContent = `${Math.round(rh)}%`;
      
      let statusText = "舒適宜人";
      if (rh > 75) statusText = "潮濕悶熱";
      else if (rh < 45) statusText = "乾燥清爽";
      document.getElementById('humidityStatus').textContent = `體感：${statusText}`;

      const codeInfo = WMO_CODES[current.weathercode] || { text: "多雲晴", icon: "fa-cloud-sun" };
      document.getElementById('currentWeatherText').innerHTML = `<i class="fa-solid ${codeInfo.icon}"></i> ${codeInfo.text}`;
    }

    // 生活與穿搭智慧建議系統
    function renderAdvice(daily) {
      const container = document.getElementById('adviceContainer');
      container.innerHTML = '';

      const todayMax = daily.temperature_2m_max[0];
      const todayMin = daily.temperature_2m_min[0];
      const todayRh = daily.relative_humidity_2m_mean[0];
      const todayRain = daily.precipitation_sum[0] || 0;
      const todayCode = daily.weathercode[0];

      const adviceList = [];

      // ☂️ 雨具指引
      if (todayRain > 0.5 || [51,53,55,61,63,65,80,81,95].includes(todayCode)) {
        adviceList.push({ icon: 'fa-umbrella', text: '今日有降雨機率，出門請記得隨身攜帶雨具並注意道路防滑。' });
      } else {
        adviceList.push({ icon: 'fa-sun', text: '今日降雨機率較低，適合戶外活動或晾曬衣物。' });
      }

      // 🧥 穿搭指引
      const tempDiff = todayMax - todayMin;
      if (todayMin < 18) {
        adviceList.push({ icon: 'fa-shirt', text: `低溫降至 ${Math.round(todayMin)}°C，天氣較涼，建議穿著保暖長袖或外套。` });
      } else if (tempDiff >= 7) {
        adviceList.push({ icon: 'fa-layer-group', text: `日夜溫差達 ${Math.round(tempDiff)}°C，建議採用洋蔥式穿搭以利增減衣物。` });
      } else {
        adviceList.push({ icon: 'fa-user-tie', text: '氣溫舒適宜人，穿著輕便棉質衣物即可。' });
      }

      // ☀️ 防曬指引
      if (todayMax >= 27) {
        adviceList.push({ icon: 'fa-temperature-arrow-up', text: `高溫可達 ${Math.round(todayMax)}°C，長時間在戶外請做好防曬並多補充水分。` });
      }

      // 💧 濕度指引
      if (todayRh >= 75) {
        adviceList.push({ icon: 'fa-droplet', text: `相對濕度達 ${Math.round(todayRh)}%，體感略為潮濕，室內可開啟除濕機維持舒適。` });
      } else if (todayRh <= 45) {
        adviceList.push({ icon: 'fa-wind', text: `空氣較為乾燥（濕度 ${Math.round(todayRh)}%），建議多補充水分並適度塗抹保濕乳液。` });
      }

      adviceList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'advice-item';
        div.innerHTML = `<i class="fa-solid ${item.icon}"></i> <span>${item.text}</span>`;
        container.appendChild(div);
      });
    }

    // Chart.js 雙 Y 軸互動圖表 (實線 vs 虛線歷史推估)
    function renderChart(daily) {
      const ctx = document.getElementById('weatherChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = daily.time.map(t => t.slice(5)); // MM-DD

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '最高氣溫 (°C)',
              data: daily.temperature_2m_max,
              borderColor: '#c88a58',
              backgroundColor: 'rgba(200, 138, 88, 0.1)',
              yAxisID: 'yTemp',
              tension: 0.3,
              segment: {
                borderDash: ctx => ctx.p0DataIndex >= 15 ? [6, 6] : undefined
              }
            },
            {
              label: '最低氣溫 (°C)',
              data: daily.temperature_2m_min,
              borderColor: '#3a2618',
              backgroundColor: 'transparent',
              yAxisID: 'yTemp',
              tension: 0.3,
              borderDash: [2, 2],
              segment: {
                borderDash: ctx => ctx.p0DataIndex >= 15 ? [6, 6] : [2, 2]
              }
            },
            {
              label: '相對濕度 (%)',
              data: daily.relative_humidity_2m_mean,
              borderColor: '#8c6239',
              backgroundColor: 'rgba(140, 98, 57, 0.05)',
              yAxisID: 'yHumidity',
              tension: 0.3,
              segment: {
                borderDash: ctx => ctx.p0DataIndex >= 15 ? [6, 6] : undefined
              }
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            tooltip: {
              callbacks: {
                title: (items) => {
                  const idx = items[0].dataIndex;
                  const dateStr = daily.time[idx];
                  return idx >= 16 ? `${dateStr} (去年歷史氣候推估)` : `${dateStr} (氣象預報)`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false }
            },
            yTemp: {
              type: 'linear',
              position: 'left',
              title: { display: true, text: '溫度 (°C)' },
              grid: { color: '#e8ded5' }
            },
            yHumidity: {
              type: 'linear',
              position: 'right',
              title: { display: true, text: '濕度 (%)' },
              min: 0,
              max: 100,
              grid: { display: false }
            }
          }
        }
      });
    }

    // 渲染逐日預報卡片
    function renderForecastCards(daily) {
      const grid = document.getElementById('forecastGrid');
      grid.innerHTML = '';

      for (let i = 0; i < daily.time.length; i++) {
        const dateStr = daily.time[i];
        const maxT = Math.round(daily.temperature_2m_max[i]);
        const minT = Math.round(daily.temperature_2m_min[i]);
        const rh = Math.round(daily.relative_humidity_2m_mean[i]);
        const rain = daily.precipitation_sum[i] || 0;
        const code = daily.weathercode[i];

        const isHistory = i >= 16;
        const codeInfo = WMO_CODES[code] || { text: "多雲晴", icon: "fa-cloud-sun" };

        let tagText = "🌤️ 舒適";
        if (rain > 0.5 || [51,53,55,61,63,65,80,81,95].includes(code)) tagText = "☂️ 記得帶傘";
        else if (maxT >= 27) tagText = "☀️ 做好防曬";
        else if (minT < 18) tagText = "🧥 保暖穿搭";

        const card = document.createElement('div');
        card.className = `daily-card ${isHistory ? 'history' : ''}`;
        card.innerHTML = `
          ${isHistory ? '<span class="history-badge">歷史推估</span>' : ''}
          <div class="daily-date">${dateStr.slice(5)}</div>
          <div class="daily-icon"><i class="fa-solid ${codeInfo.icon}"></i></div>
          <div class="daily-temp">${minT}°C - ${maxT}°C</div>
          <div class="daily-humidity"><i class="fa-solid fa-droplet"></i> ${rh}%</div>
          <span class="daily-tag">${tagText}</span>
        `;
        grid.appendChild(card);
      }
    }

    function showLoading(show) {
      const loading = document.getElementById('loading');
      if (show) loading.classList.add('active');
      else loading.classList.remove('active');
    }
  </script>
</body>
</html>
